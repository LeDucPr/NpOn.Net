name: CI - NpOn Build and Push Docker Images

on:
  push:
    branches:
      - "dev" # Chạy mỗi khi có push lên nhánh dev

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Convert owner to lowercase
        id: string
        run: echo "owner_lc=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push SSO Controller
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./SSO/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.string.outputs.owner_lc }}/sso-controller:latest

      - name: Build and push Account Service
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./AccountService/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.string.outputs.owner_lc }}/account-service:latest

      - name: Build and push General Service
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./GeneralService/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.string.outputs.owner_lc }}/general-service:latest

      - name: Redeploy SSO Controller on Rancher
        run: |
          curl -u "${{ secrets.RANCHER_ACCESS_KEY }}:${{ secrets.RANCHER_SECRET_KEY }}" \
          -X POST \
          "${{ secrets.RANCHER_URL }}/v3/project/${{ secrets.RANCHER_PROJECT_ID }}/workloads/deployment:${{ secrets.RANCHER_NAMESPACE }}:sso-controller?action=redeploy"

      - name: Redeploy Account Service on Rancher
        run: |
          curl -u "${{ secrets.RANCHER_ACCESS_KEY }}:${{ secrets.RANCHER_SECRET_KEY }}" \
          -X POST \
          "${{ secrets.RANCHER_URL }}/v3/project/${{ secrets.RANCHER_PROJECT_ID }}/workloads/deployment:${{ secrets.RANCHER_NAMESPACE }}:account-service?action=redeploy"

      - name: Redeploy General Service on Rancher
        run: |
          curl -u "${{ secrets.RANCHER_ACCESS_KEY }}:${{ secrets.RANCHER_SECRET_KEY }}" \
          -X POST \
          "${{ secrets.RANCHER_URL }}/v3/project/${{ secrets.RANCHER_PROJECT_ID }}/workloads/deployment:${{ secrets.RANCHER_NAMESPACE }}:general-service?action=redeploy"
