
name: CI - NpOn Build and Push Docker Images

on:
  push:
    branches: [ "dev" ] # Chạy mỗi khi có push lên nhánh main

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
         uses: docker/setup-buildx-action@v2
 
       - name: Login to GitHub Container Registry
         uses: docker/login-action@v2
         with:
           registry: ghcr.io
           username: ${{ github.repository_owner }}
           password: ${{ secrets.GITHUB_TOKEN }}
 
       - name: Build and push SSO Controller
         uses: docker/build-push-action@v4
         with:
           context: ./sso-controller # Đường dẫn tới thư mục service
           file: ./sso-controller/Dockerfile
           push: true
           tags: ghcr.io/${{ github.repository_owner }}/sso-controller:latest
 
       - name: Build and push Service Account
         uses: docker/build-push-action@v4
         with:
           context: ./service-account
           file: ./service-account/Dockerfile
           push: true
           tags: ghcr.io/${{ github.repository_owner }}/service-account:latest
 
       - name: Build and push General Service
         uses: docker/build-push-action@v4
         with:
           context: ./general-service
           file: ./general-service/Dockerfile
           push: true
           tags: ghcr.io/${{ github.repository_owner }}/general-service:latest
