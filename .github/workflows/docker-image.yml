
name: CI - NpOn Build and Push Docker Images

on:
  push:
    branches: [ "dev" ] # Chạy mỗi khi có push lên nhánh main

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
         uses: docker/setup-buildx-action@v2
 
       - name: Login to GitHub Container Registry
         uses: docker/login-action@v2
         with:
           registry: ghcr.io
           username: ${{ github.repository_owner }}
           password: ${{ secrets.GITHUB_TOKEN }}
 
       - name: Build and push SSO Controller
         uses: docker/build-push-action@v4
         with:
           context: .
           file: ./sso-controller/Dockerfile
           push: true
           tags: ghcr.io/${{ github.repository_owner }}/sso-controller:latest
 
       - name: Build and push Service Account
         uses: docker/build-push-action@v4
         with:
           context: .
           file: ./service-account/Dockerfile
           push: true
           tags: ghcr.io/${{ github.repository_owner }}/service-account:latest
 
       - name: Build and push General Service
         uses: docker/build-push-action@v4
         with:
           context: .
           file: ./general-service/Dockerfile
           push: true
           tags: ghcr.io/${{ github.repository_owner }}/general-service:latest


      - name: Redeploy SSO Controller on Rancher
         uses: Taction/rancher-redeploy@v1
         with:
           rancher_url: ${{ secrets.RANCHER_URL }}
           rancher_access_key: ${{ secrets.RANCHER_ACCESS_KEY }}
           rancher_secret_key: ${{ secrets.RANCHER_SECRET_KEY }}
           project_id: ${{ secrets.RANCHER_PROJECT_ID }}
           workload_name: 'sso-controller' # Tên workload trên Rancher
 
       - name: Redeploy Service Account on Rancher
         uses: Taction/rancher-redeploy@v1
         with:
           rancher_url: ${{ secrets.RANCHER_URL }}
           rancher_access_key: ${{ secrets.RANCHER_ACCESS_KEY }}
           rancher_secret_key: ${{ secrets.RANCHER_SECRET_KEY }}
           project_id: ${{ secrets.RANCHER_PROJECT_ID }}
           workload_name: 'service-account' # Tên workload trên Rancher
 
       - name: Redeploy General Service on Rancher
         uses: Taction/rancher-redeploy@v1
         with:
           rancher_url: ${{ secrets.RANCHER_URL }}
           rancher_access_key: ${{ secrets.RANCHER_ACCESS_KEY }}
           rancher_secret_key: ${{ secrets.RANCHER_SECRET_KEY }}
           project_id: ${{ secrets.RANCHER_PROJECT_ID }}
           workload_name: 'general-service' # Tên workload trên Rancher
